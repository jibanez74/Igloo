services:
  igloo:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/jibanez74/igloo:${IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      ENABLE_LOGGER: ${ENABLE_LOGGER:-false}
      ENABLE_WATCHER: ${ENABLE_WATCHER:-false}
      DOWNLOAD_IMAGES: ${DOWNLOAD_IMAGES:-false}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      JELLYFIN_TOKEN: ${JELLYFIN_TOKEN:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      LOG_TO_STDOUT: ${LOG_TO_STDOUT:-true}
      HARDWARE_ACCELERATION_DEVICE: ${HARDWARE_ACCELERATION_DEVICE:-cpu}
      # NVIDIA GPU transcoding requires nvidia-container-toolkit on the host.
      # NVIDIA_DRIVER_CAPABILITIES: all
      # NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - type: bind
        source: ${CONFIG_DIR:-./config}
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${TRANSCODE_DIR:-./transcode}
        target: /transcode
        bind:
          create_host_path: false
      - type: bind
        source: ${MOVIES_DIR:-./media/movies}
        target: /media/movies
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SHOWS_DIR:-./media/shows}
        target: /media/shows
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MUSIC_DIR:-./media/music}
        target: /media/music
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    # NVIDIA GPU transcoding:
    # 1. Install nvidia-container-toolkit on the host.
    # 2. Set HARDWARE_ACCELERATION_DEVICE=nvidia in .env.
    # 3. Uncomment the NVIDIA environment lines above and this block.
    # runtime: nvidia
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

    # Intel QSV transcoding:
    # 1. Set HARDWARE_ACCELERATION_DEVICE=intel in .env.
    # 2. Set RENDER_GROUP_ID to the host render group GID.
    # 3. Uncomment this block.
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    # group_add:
    #   - "${RENDER_GROUP_ID:-0}"
