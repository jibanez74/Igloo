name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# No job publishes anything; read access is all the checkout needs.
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: server/go.sum

      # The pinned ffmpeg/ffprobe that release binaries embed (media-payloads/payloads.lock).
      - name: Install media tools
        run: |
          make media-bin
          echo "$PWD/server/dist/media-bin" >> "$GITHUB_PATH"

      - name: Vet and check for unreachable code
        run: make lint-server

      - name: Race-test music scanning and Spotify
        run: make test-music-race

      - name: Run Go tests
        run: |
          cd server
          mkdir -p cmd/api/webdist cmd/api/openapi
          touch cmd/api/webdist/.keep
          cp ../docs/openapi.json cmd/api/openapi/openapi.json
          go test -count=1 -v -tags "externalbin sqlite_fts5" ./...

      # The OpenAPI checks need Go and the media tools above, plus the web
      # dependencies for Redocly and the generated-type drift check.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Lint contract, detect generated-type drift, and verify router coverage
        run: make test-openapi check-openapi

  # Runs in the pinned Playwright image the screenshot baselines are drawn in
  # (`make test-visual-docker`, docs/design-system.md §2.5), pinned by digest.
  # Its Chromium and system libraries come with it, so nothing is installed
  # with apt, and its Node (26) is past the release that defines its own
  # localStorage global: the unit tests below prove the execArgv opt-out in
  # web/vite.config.ts leaves jsdom's in place.
  test-frontend:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # setup-bun needs unzip, which the image does not ship; npm installs
      # the same release binary.
      - name: Install Bun
        run: npm install --global --no-fund --no-audit bun

      - name: Show Node version
        run: node --version

      # The image tag must match the locked @playwright/test and the
      # Makefile's VISUAL_IMAGE, or local baselines drift from this browser.
      - name: Check the image matches the locked Playwright
        run: cd web && bun run check:playwright-image

      - name: Install dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Lint
        run: cd web && bun run lint

      - name: Test
        run: cd web && bun run test

      - name: Type-check and build
        run: cd web && bun run build

      # The component gallery is a development page. Its marker string must
      # not reach the bundle the Go binary embeds.
      - name: Verify the component gallery stayed out of the build
        run: |
          if grep -rq igloo-ui-gallery web/dist; then
            echo "::error::The dev-only component gallery is in the production bundle"
            exit 1
          fi

      # The whole mocked suite, boot.spec included, against the bundle built
      # above. Specs that need real media skip without E2E_BASE_URL.
      - name: Test e2e (mocked API, production build)
        run: cd web && E2E_PRODUCTION=1 bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
