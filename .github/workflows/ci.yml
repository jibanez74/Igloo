name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_call:

# No job publishes anything; read access is all the checkout needs.
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: server/go.sum

      # The pinned ffmpeg/ffprobe that release binaries embed (media-payloads/payloads.lock).
      - name: Install media tools
        run: |
          make media-bin
          echo "$PWD/server/dist/media-bin" >> "$GITHUB_PATH"

      - name: Vet and check for unreachable code
        run: make lint-server

      - name: Race-test music scanning and Spotify
        run: make test-music-race

      - name: Run Go tests
        run: |
          cd server
          mkdir -p cmd/api/webdist cmd/api/openapi
          touch cmd/api/webdist/.keep
          cp ../docs/openapi.json cmd/api/openapi/openapi.json
          go test -count=1 -v -tags "externalbin sqlite_fts5" ./...

  test-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: server/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install media tools and web dependencies
        run: |
          make media-bin
          echo "$PWD/server/dist/media-bin" >> "$GITHUB_PATH"
          cd web && bun install --frozen-lockfile

      - name: Lint contract, detect generated-type drift, and verify router coverage
        run: make test-openapi check-openapi

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Lint
        run: cd web && bun run lint

      - name: Verify generated OpenAPI types
        run: cd web && bun run check:openapi

      - name: Test
        run: cd web && bun run test

      - name: Type-check and build
        run: cd web && bun run build

      # The component gallery is a development page. Its marker string must
      # not reach the bundle the Go binary embeds.
      - name: Verify the component gallery stayed out of the build
        run: |
          if grep -rq igloo-ui-gallery web/dist; then
            echo "::error::The dev-only component gallery is in the production bundle"
            exit 1
          fi

      # --with-deps installs system packages with apt, and the runner's
      # package mirror sometimes fails to resolve for minutes at a time. Try
      # again before failing the job: five attempts over about seven minutes.
      - name: Install Playwright Chromium
        run: |
          cd web
          for attempt in 1 2 3 4 5; do
            if bun x playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              wait_seconds=$((attempt * 45))
              echo "::warning::Browser install failed (attempt $attempt of 5); retrying in ${wait_seconds}s."
              sleep "$wait_seconds"
            fi
          done
          echo "::error::Browser install failed five times."
          exit 1

      # The whole mocked suite, boot.spec included, against the bundle built
      # above. Specs that need real media skip without E2E_BASE_URL.
      - name: Test e2e (mocked API, production build)
        run: cd web && E2E_PRODUCTION=1 bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  # Screenshot baselines of the component gallery and a few pages
  # (web/e2e/visual). The committed baselines were drawn by this job, so the
  # image is pinned: a new runner image or Playwright version can move pixels
  # and then needs the baselines regenerated here.
  test-visual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: cd web && bun install --frozen-lockfile

      # --with-deps installs system packages with apt, and the runner's
      # package mirror sometimes fails to resolve for minutes at a time. Try
      # again before failing the job: five attempts over about seven minutes.
      - name: Install Playwright Chromium
        run: |
          cd web
          for attempt in 1 2 3 4 5; do
            if bun x playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              wait_seconds=$((attempt * 45))
              echo "::warning::Browser install failed (attempt $attempt of 5); retrying in ${wait_seconds}s."
              sleep "$wait_seconds"
            fi
          done
          echo "::error::Browser install failed five times."
          exit 1

      - name: Compare screenshots with the committed baselines
        id: compare
        run: cd web && bun run test:visual

      # Uploaded before the redraw below, which writes over the same folders:
      # this one holds the expected, actual and diff images of what failed.
      - name: Upload the comparison report
        if: failure() && steps.compare.conclusion == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-visual
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

      # A difference is either a regression or an intended change. For an
      # intended one, download this artifact, review the images and commit
      # them over web/e2e/visual/__screenshots__. Only a failed comparison
      # redraws: after a failed install or setup there is nothing to draw from.
      - name: Redraw the baselines for review
        if: failure() && steps.compare.conclusion == 'failure'
        run: cd web && bun run test:visual:update

      - name: Upload redrawn baselines
        if: failure() && steps.compare.conclusion == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baselines
          path: web/e2e/visual/__screenshots__
          retention-days: 7

  # test-frontend runs on whatever Node the runner image ships. Node 25+
  # defines its own localStorage global, so this job pins Node 26 to prove
  # the execArgv opt-out in web/vite.config.ts leaves jsdom's in place.
  test-frontend-node26:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Show Node version
        run: node --version

      - name: Install dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Test
        run: cd web && bun run test
