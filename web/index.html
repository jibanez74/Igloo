<!doctype html>
<html lang="en" data-app-ready="false">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Pre-boot fallback only: React inserts route titles ahead of this one,
       and the root route's head supplies the description. -->
  <title>Igloo</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="application-name" content="Igloo" />
  <meta name="apple-mobile-web-app-title" content="Igloo" />
  <!-- BEGIN GENERATED: theme boot — edit src/lib/theme-tokens.ts and run `bun run generate:theme` -->
  <meta name="theme-color" content="#0A1322" />
  <!-- Anti-flash: apply the stored theme before any CSS paints. Defaults
       to dark, including on storage errors. -->
  <script>
    (function () {
      try {
        var light = localStorage.getItem("igloo-theme") === "light";
        document.documentElement.classList.toggle("dark", !light);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", light ? "#F2F7FC" : "#0A1322");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <!-- END GENERATED: theme boot -->
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/src/assets/boot.css" />
</head>

<body>
  <div id="initial-splash" role="status" aria-live="polite" aria-atomic="true">
    <div class="initial-splash__content">
      <p class="initial-splash__title">Igloo</p>
      <p class="initial-splash__message">Starting Igloo...</p>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
